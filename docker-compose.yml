version: '3.8'

# =============================================================================
# OmniRoute - LLM Router (Simplified Docker Compose)
# =============================================================================
# Minimal docker-compose.yml for running OmniRoute standalone.
# No Hermes Agent included.
# =============================================================================

networks:
  omniroute-net:
    driver: bridge

services:
  redis:
    image: redis:7-alpine
    container_name: omniroute-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - redis-data:/data
    networks:
      - omniroute-net

  omniroute:
    image: ghcr.io/diegosouzapw/omniroute:latest
    container_name: omniroute
    restart: unless-stopped
    env_file:
      - ./omniroute/.env
    environment:
      - DATA_DIR=/app/data
      - OMNIROUTE_BASE_PATH=/app/data
      - PORT=20128
      - DASHBOARD_PORT=20128
      - API_PORT=20129
      - API_HOST=0.0.0.0
      - LIVE_WS_PORT=20132
      - LIVE_WS_HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379
      - AUTH_SECRET=${AUTH_SECRET:-}
      - DASHBOARD_AUTH_USER=${DASHBOARD_AUTH_USER:-}
      - DASHBOARD_AUTH_PASS=${DASHBOARD_AUTH_PASS:-}
      - NODE_OPTIONS=--max-old-space-size=2048
    ports:
      - "20128:20128"   # Dashboard
      - "20129:20129"   # API
      - "20132:20132"   # Live WS
    volumes:
      - ./omniroute/data:/app/data
      - ./omniroute/.env:/app/.env:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:20128/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - omniroute-net

volumes:
  redis-data:
    driver: local

# =============================================================================
# USAGE
# =============================================================================
# 1. Copy example env file:
#    cp ./omniroute/.env.example ./omniroute/.env
#    Edit AUTH_SECRET, LLM provider keys, etc.
#
# 2. Start services:
#    docker compose up -d
#
# 3. Access:
#    - Dashboard: http://localhost:20128
#    - API: http://localhost:20129/v1/*
#    - WebSocket: ws://localhost:20132
# =============================================================================
